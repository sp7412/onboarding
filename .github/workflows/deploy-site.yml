name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - "plan/**"
      - "docs/**"
      - "notes/**"
      - "templates/**"
      - "labs/src/**"
      - "labs/stlab/scenarios.py"
      - "labs/stlab/turn_sim.py"
      - "README.md"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test intraday VWAP aggregation
        run: python3 -m unittest discover -s scripts -p 'test_update_ttan_vwap.py'
      - name: Refresh TTAN intraday VWAP when credentials are configured
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED }}
        run: |
          if [ -z "$ALPACA_API_KEY" ] || [ -z "$ALPACA_SECRET_KEY" ]; then
            echo "::warning::TTAN charts will show a data-setup notice until ALPACA_API_KEY and ALPACA_SECRET_KEY are added as repository Actions secrets."
          else
            python3 scripts/update_ttan_vwap.py --days 370 --output site/src/data/ttan-vwap.json
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.38
      - name: Install dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Run site unit tests
        working-directory: site
        run: bun run test
      - name: Build site
        working-directory: site
        run: bun run build
      - name: Check built-site links
        working-directory: site
        run: node scripts/check-links.mjs
      - name: Check site accessibility
        working-directory: site
        run: bun run test:a11y
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
