name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - "plan/**"
      - "docs/**"
      - "notes/**"
      - "templates/**"
      - "labs/src/**"
      - "labs/stlab/scenarios.py"
      - "labs/stlab/turn_sim.py"
      - "README.md"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install TTAN market-data client
        run: python3 -m pip install 'yfinance>=1.7.0'
      - name: Refresh public TTAN daily closing prices
        run: python3 scripts/update_ttan_daily.py --days 370 --output site/src/data/ttan-vwap.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.38
      - name: Install dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Run site unit tests
        working-directory: site
        run: bun run test
      - name: Build site
        working-directory: site
        run: bun run build
      - name: Check built-site links
        working-directory: site
        run: node scripts/check-links.mjs
      - name: Check site accessibility
        working-directory: site
        run: bun run test:a11y
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
