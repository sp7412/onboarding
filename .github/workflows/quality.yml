name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff
      - name: Lint teaching package and scripts
        run: ruff check labs/stlab scripts
      - name: Run focused fixture tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check repository hygiene
        run: python scripts/check_repo.py
      - name: Check sensitive content
        env:
          SENSITIVE_PATTERNS: ${{ secrets.SENSITIVE_PATTERNS }}
        run: python scripts/check_sensitive.py
      - name: Run offline notebooks
        run: python scripts/run_notebooks.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.38
      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Test site content parsers and models
        working-directory: site
        run: bun run test
      - name: Type-check site
        working-directory: site
        run: bunx astro check
      - name: Build site
        working-directory: site
        run: bun run build
      - name: Check internal site links
        working-directory: site
        run: node scripts/check-links.mjs
      - name: Check site accessibility
        working-directory: site
        run: bun run test:a11y
